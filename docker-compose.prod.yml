# SABE en producción (F12). Uso:
#   sudo docker compose -p sabe-prod -f docker-compose.prod.yml up -d --build
# Variables en .env.prod (copia de .env.prod.example; nunca se sube al repositorio).
services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  # Respaldo diario de la base en ./backups. Solo borra sus propios respaldos (sabe_*.sql.gz) de más de 7 días.
  backup:
    image: postgres:16
    restart: unless-stopped
    env_file: .env.prod
    environment:
      PGHOST: db
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 600  # el primer respaldo, ya con las migraciones aplicadas
        while true; do
          archivo=/backups/sabe_$$(date +%Y%m%d_%H%M).sql.gz
          PGPASSWORD="$$POSTGRES_PASSWORD" pg_dump -U "$$POSTGRES_USER" "$$POSTGRES_DB" | gzip > "$$archivo" && echo "Respaldo: $$archivo"
          find /backups -maxdepth 1 -name 'sabe_*.sql.gz' -mtime +7 -delete
          sleep 86400
        done

volumes:
  pgdata:
  caddy_data:
  caddy_config:
