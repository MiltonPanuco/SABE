# Solo levanta PostgreSQL para desarrollo:  docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sabe}
      POSTGRES_USER: ${POSTGRES_USER:-sabe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sabe}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - sabe_pgdata:/var/lib/postgresql/data

volumes:
  sabe_pgdata:
